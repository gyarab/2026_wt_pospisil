<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <title>RK Š̌neček - hypertajná Clicker Hra</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <header>
        <h1>Clicker</h1>
        <nav>
            <a href="../index.html">O nás</a> |
            <a href="../druhy/kontakty.html">Kontakt</a> |
            <a href="../druhy/nemovitosti.html">Nemovitosti</a>
        </nav>
        </header>
        <main class="mt-4">
            <h1>RK Č̌licker</h1>
            <p id="clicks" class="mt-4">0</p>
            <button id="clickerButton" class="btn btn-primary">Zisk měny</button>
            <button id="reset" class="btn btn-primary">Reset</button>
            <script>
                let mena = 0;

                //clicker
                clickerButton.addEventListener("click", () => {
                    mena += 1;
                    document.getElementById("clicks").textContent = mena;
                });

                //reset progress
                reset.addEventListener("click", () => {
                    location.reload();
                })
            </script>
        </main>
    </body>
